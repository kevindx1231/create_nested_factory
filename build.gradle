plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.144'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
java.withSourcesJar()

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://modmaven.dev' }
}

legacyForge {
    enable {
        if (project.hasProperty('forgeVersion')) {
            forgeVersion = project.property('forgeVersion')
        } else {
            neoForgeVersion = project.neo_version
        }
    }
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
            programArgument '-mixin.config=create.mixins.json'
            programArgument '-mixin.config=ponder.mixins.json'
            programArgument '-mixin.config=create_nested_factory.mixins.json'
            programArgument '-mixin.config=create_nested_factory_logistics.mixins.json'
        }
        client { client(); gameDirectory = file('run') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        data {
            data()
            gameDirectory = file('run-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

sourceSets {
    main {
        java.srcDir 'logistics-compat/src/main/java'
        resources.srcDir 'logistics-compat/src/main/resources'
        resources.srcDir 'src/generated/resources'
    }
}

// LegacyForge only provisions the main source set. Plain JVM regression programs
// need the same named Minecraft classes and dependency jars without launching a game.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
// Exercise optional compatibility against the same named API used by compilation.
// This does not add Mekanism to the published mod or development game runtime.
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath.filter { it.name.startsWith('Mekanism-') }
tasks.named('compileTestJava') { dependsOn tasks.named('createMinecraftArtifacts') }

def regressionPrograms = [
    'RoomPortReconnect': 'block.entity.RoomPortReconnectRegression',
    'MekanismLogistics': 'MekanismLogisticsRegression',
    'MekanismHeat': 'MekanismHeatRegression',
    'FactoryBlueprint': 'block.entity.FactoryBlueprintRegression',
    'PipezFluidAdapter': 'PipezFluidAdapterRegression',
    'ExplorationSession': 'ExplorationSessionRegression',
    'DimensionResources': 'DimensionResourcesRegression',
    'RecipeResources': 'RecipeResourcesRegression',
    'StaticPassageParity': 'StaticPassageParityRegression',
    'LegacyBackport': 'LegacyBackportRegression',
    'PassageTravelGuard': 'registry.PassageTravelGuardRegression',
    'PassageInteractions': 'PassageInteractionRegression',
    'PocketFreezeIndex': 'PocketFreezeIndexRegression',
    'PocketRegistryScopes': 'PocketRegistryScopeRegression',
    'ReleaseFixes': 'ReleaseFixRegression',
    'FactoryLearningController': 'block.entity.FactoryLearningControllerRegression',
    'PlantBlueprintCapital': 'block.entity.PlantBlueprintCapitalRegression',
    'FactoryRoomGeometry': 'block.entity.FactoryRoomGeometryRegression',
    'FactoryLifecycleTransitions': 'block.entity.FactoryLifecycleTransitionsRegression',
    'FactorySessionLocationPolicy': 'block.FactorySessionLocationPolicyRegression',
    'CnfCommands': 'CnfCommandsRegression'
]
regressionPrograms.each { name, className ->
    def regression = tasks.register("test${name}", JavaExec) {
        group = 'verification'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "com.createnestedfactory.create_nested_factory.${className}"
        systemProperty 'user.language', 'en'
    }
    tasks.named('check') { dependsOn regression }
}

tasks.register('writeParityClasspath') {
    dependsOn tasks.named('testClasses')
    doLast {
        file('migration/current-test-classpath.txt').text = sourceSets.test.runtimeClasspath.asPath
    }
}

dependencies {
    modImplementation "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    modImplementation "net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}"
    modCompileOnly "dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
    modImplementation "com.tterrag.registrate:Registrate:${registrate_version}"
    modCompileOnly "mekanism:Mekanism:${mekanism_version}:api"
    implementation 'io.github.llamalad7:mixinextras-forge:0.4.1'
    // Both Forge 47 and NeoForge 47 need the Forge bootstrap in production, too.
    jarJar('io.github.llamalad7:mixinextras-forge:0.4.1') {
        version { strictly '[0.4.1,)'; prefer '0.4.1' }
    }
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.4.1'))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}

mixin {
    add sourceSets.main, 'create_nested_factory.refmap.json'
    config 'create_nested_factory.mixins.json'
    config 'create_nested_factory_logistics.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-Xmaxerrs', '500']
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = ['minecraft_version_range', 'neo_version_range', 'loader_version_range', 'mod_id',
                 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description']
            .collectEntries { [(it): project.property(it)] }
    inputs.properties props
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
    expand props
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

jar {
    manifest.attributes([
        'MixinConfigs': 'create_nested_factory.mixins.json,create_nested_factory_logistics.mixins.json',
        'Implementation-Version': project.version,
        'Built-On-Minecraft': minecraft_version
    ])
}
idea.module.downloadSources = true

// Opt-in integration harness; its classes and downloaded mods never enter the release jar.
if (project.hasProperty('freezeCompatTest')) {
    apply from: 'gradle/freeze-compat.gradle'
}
